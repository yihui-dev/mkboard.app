appId: app.mkboard.desktop
productName: MkBoard
protocols:
  - name: MkBoard
    schemes:
      - mkboard
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: runtime/current
    to: runtime
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"

npmRebuild: false
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  identity: null
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  sign: false
  filesystem: APFS
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

win:
  icon: resources/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MkBoard
  deleteAppDataOnUninstall: false

linux:
  executableName: mkboard
  icon: resources/icon.png
  category: Video
  maintainer: MkBoard Contributors
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
