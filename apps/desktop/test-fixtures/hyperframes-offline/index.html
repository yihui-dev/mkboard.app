<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131a; }
      #root { position: relative; width: 1920px; height: 1080px; background: linear-gradient(135deg, #10131a, #27365f); }
      #title { position: absolute; inset: 0; display: grid; place-items: center; color: white; font: 700 96px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-start="0" data-duration="10" data-track-index="0">MkBoard Offline Runtime</div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = { pause() {}, seek() {}, duration() { return 10; } };
    </script>
  </body>
</html>
