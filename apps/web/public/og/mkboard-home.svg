<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MkBoard - 专属自媒体人的分镜 Agent</title>
  <desc id="desc">MkBoard Open Graph image with the official app icon, storyboard agent positioning, and a desktop storyboard workspace preview.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.55" stop-color="#f6f7f1"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="yellowCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6bf"/>
      <stop offset="0.46" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f1ea"/>
    </linearGradient>
    <linearGradient id="accentPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ce"/>
      <stop offset="1" stop-color="#fffef7"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#171717" opacity="0.14"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#171717" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#171717" flood-opacity="0.08"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="610" y="148" width="518" height="398" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <circle cx="1016" cy="88" r="180" fill="#ffd94a" opacity="0.42"/>
  <circle cx="82" cy="602" r="210" fill="#ffd94a" opacity="0.3"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.42"/>

  <g transform="translate(72 50)">
    <image href="../images/brand/mkboard-icon.png" x="0" y="0" width="58" height="58" preserveAspectRatio="xMidYMid meet"/>
    <text x="76" y="38" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">MkBoard</text>
  </g>

  <g transform="translate(72 148)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#fff2a9" stroke="#ecd35f"/>
    <text x="21" y="28" fill="#5f5100" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">自媒体分镜 Agent</text>
    <rect x="184" y="0" width="128" height="42" rx="21" fill="#ffffff" stroke="#dedfd7"/>
    <text x="207" y="28" fill="#303640" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">AI 视频草稿</text>

    <text x="0" y="126" fill="#101114" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="950">专属自媒体人的</text>
    <text x="0" y="198" fill="#101114" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="950">分镜 Agent</text>
    <text x="0" y="252" fill="#59616d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="680">拆脚本、排节奏、生成可编辑分镜，</text>
    <text x="0" y="288" fill="#59616d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="680">继续推进成 AI 剪辑草稿。</text>

    <g transform="translate(0 326)" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">
      <rect x="0" y="0" width="72" height="38" rx="19" fill="#ffffff" stroke="#dedfd7"/>
      <text x="18" y="25" fill="#303640">脚本</text>
      <text x="84" y="25" fill="#9b8a26">→</text>
      <rect x="112" y="0" width="72" height="38" rx="19" fill="#ffffff" stroke="#dedfd7"/>
      <text x="130" y="25" fill="#303640">镜头</text>
      <text x="196" y="25" fill="#9b8a26">→</text>
      <rect x="224" y="0" width="72" height="38" rx="19" fill="#ffffff" stroke="#dedfd7"/>
      <text x="242" y="25" fill="#303640">分镜</text>
      <text x="308" y="25" fill="#9b8a26">→</text>
      <rect x="336" y="0" width="72" height="38" rx="19" fill="#ffffff" stroke="#dedfd7"/>
      <text x="354" y="25" fill="#303640">草稿</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="610" y="148" width="518" height="398" rx="30" fill="#ffffff" stroke="#e2e2d9" stroke-width="2"/>
    <g clip-path="url(#windowClip)">
      <rect x="610" y="148" width="518" height="56" fill="#f7f8f2"/>
      <circle cx="638" cy="176" r="6" fill="#d7d7d7"/>
      <circle cx="660" cy="176" r="6" fill="#ffd94a"/>
      <circle cx="682" cy="176" r="6" fill="#68d391"/>
      <text x="720" y="182" fill="#59616d" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="840">Rainy Reunion · MkBoard</text>
      <line x1="610" y1="204" x2="1128" y2="204" stroke="#e8e8df"/>

      <rect x="610" y="204" width="64" height="342" fill="#ffffff"/>
      <line x1="674" y1="204" x2="674" y2="546" stroke="#ecece4"/>
      <image href="../images/brand/mkboard-icon.png" x="624" y="222" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
      <rect x="623" y="276" width="38" height="38" rx="12" fill="#fff1a5"/>
      <rect x="623" y="328" width="38" height="38" rx="12" fill="#f2f3ed"/>
      <rect x="623" y="380" width="38" height="38" rx="12" fill="#f2f3ed"/>

      <rect x="674" y="204" width="188" height="342" fill="#ffffff"/>
      <line x1="862" y1="204" x2="862" y2="546" stroke="#ecece4"/>
      <text x="696" y="246" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">脚本拆镜头</text>
      <rect x="696" y="270" width="132" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="294" width="146" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="318" width="86" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="352" width="132" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="376" width="146" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="400" width="86" height="10" rx="5" fill="#dfe3dc"/>
      <rect x="696" y="434" width="132" height="10" rx="5" fill="#dfe3dc"/>

      <rect x="862" y="204" width="266" height="342" fill="#fafaf6"/>
      <g transform="translate(886 228)">
        <g filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <path d="M14 42 C24 22,34 48,48 28" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
          <circle cx="54" cy="16" r="8" fill="#ffd94a" opacity="0.75"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
        <g transform="translate(86 0)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <path d="M12 38 L28 22 L42 36 L58 18" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
        <g transform="translate(172 0)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <circle cx="35" cy="29" r="15" fill="none" stroke="#171717" stroke-width="3"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
        <g transform="translate(0 118)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <path d="M14 42 C24 22,34 48,48 28" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
        <g transform="translate(86 118)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <path d="M12 38 L28 22 L42 36 L58 18" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
        <g transform="translate(172 118)" filter="url(#cardShadow)">
          <rect x="0" y="0" width="70" height="100" rx="14" fill="#ffffff" stroke="#e2e2d9"/>
          <rect x="0" y="0" width="70" height="58" rx="14" fill="url(#yellowCard)"/>
          <circle cx="35" cy="29" r="15" fill="none" stroke="#171717" stroke-width="3"/>
          <rect x="12" y="72" width="46" height="6" rx="3" fill="#dfe3dc"/>
          <rect x="12" y="86" width="28" height="6" rx="3" fill="#ffd94a"/>
        </g>
      </g>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="912" y="452" width="258" height="92" rx="22" fill="#171717"/>
    <text x="934" y="488" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">Agent 正在整理分镜</text>
    <text x="934" y="518" fill="#d8d8d8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">拆镜头、补提示词、同步素材。</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="1084" y="110" width="72" height="72" rx="22" fill="#ffd94a"/>
    <text x="1104" y="160" fill="#171717" font-family="Arial, sans-serif" font-size="40" font-weight="900">✦</text>
  </g>
</svg>
