name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @mkboard/desktop typecheck
      - run: pnpm --filter @mkboard/desktop build
      - run: pnpm --filter @mkboard/desktop test:elevenlabs-speech
      - run: pnpm --filter @mkboard/desktop test:desktop-updater
      - run: pnpm --filter @mkboard/web build
