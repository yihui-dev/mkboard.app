name: Mobile Release (Android APK & iOS TestFlight)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: both
        options:
          - both
          - android
          - ios
      upload_testflight:
        description: Upload signed iOS IPA to TestFlight
        type: boolean
        required: false
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build Android arm64 APK
        working-directory: apps/mobile
        run: npm run apk:arm64

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkboard-mobile-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Write App Store Connect API Key from secret
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::error::Missing APPLE_API_KEY_P8_BASE64 secret"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Build signed iOS IPA (and optional TestFlight upload)
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/asc/AuthKey.p8
        run: |
          if [ "${{ inputs.upload_testflight }}" = "true" ]; then
            node scripts/build-ios.mjs --upload
          else
            node scripts/build-ios.mjs
          fi

      - name: Upload signed iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkboard-mobile-ios-ipa
          path: apps/mobile/releases/*.ipa
          retention-days: 14
