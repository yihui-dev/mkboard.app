name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            script: dist:mac:x64:oss
          - os: ubuntu-24.04
            platform: linux
            script: dist:linux
          - os: windows-latest
            platform: win
            script: dist:win:oss
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile=false

      - name: Check optional Apple signing secrets
        if: matrix.platform == 'mac'
        id: apple_signing
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          APPLE_ASP: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PWD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi
          if { [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; } || { [ -n "$APPLE_ID_VAL" ] && [ -n "$APPLE_ASP" ] && [ -n "$APPLE_TEAM" ]; }; then
            echo "has_notarization=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notarization=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package signed macOS installers
        if: matrix.platform == 'mac' && steps.apple_signing.outputs.has_signing == 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MKBOARD_MAC_NOTARIZE: ${{ steps.apple_signing.outputs.has_notarization == 'true' && '1' || '0' }}
        run: pnpm --filter @mkboard/desktop exec node scripts/pack-mac.mjs --signed --arch arm64,x64

      - name: Package unsigned desktop installer
        if: matrix.platform != 'mac' || steps.apple_signing.outputs.has_signing != 'true'
        shell: bash
        run: pnpm --filter @mkboard/desktop run ${{ matrix.script }}

      - name: Publish signed macOS release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && steps.apple_signing.outputs.has_signing == 'true'
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

      - name: Publish Windows and Linux release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform != 'mac'
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
