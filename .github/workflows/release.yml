name: Release Desktop (Open-Source Unsigned Matrix)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac-x64
            script: dist:mac:x64:oss
          - os: ubuntu-24.04
            platform: linux
            script: dist:linux
          - os: windows-latest
            platform: win
            script: dist:win:oss
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile=false
      - name: Package desktop installer
        shell: bash
        run: pnpm --filter @mkboard/desktop run ${{ matrix.script }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
